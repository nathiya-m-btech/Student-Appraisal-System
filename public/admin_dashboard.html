<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body.dashboard-bg {
    background: #f8f9fa;
}
.sidebar {
    width: 220px;
    min-height: 100vh;
    background: #343a40; /* Dark gray */
    color: #fff;
}
.sidebar .logo-sm {
    width: 60px;
}
.sidebar a.nav-link {
    color: #adb5bd;
}
.sidebar a.nav-link.active {
    color: #fff;
    background: #495057;
    border-radius: 5px;
}
.sidebar a.nav-link:hover {
    color: #fff;
    background: #495057;
}
.sidebar-footer {
    color: #ced4da;
}
.stat-card {
    background: #fff;
    border-radius: 10px;
    text-align: center;
}
.content {
    flex: 1;
}
</style>
</head>
<body class="dashboard-bg">
<div class="d-flex" id="app-root">
  <!-- Sidebar -->
  <aside class="sidebar shadow-sm d-flex flex-column">
    <div class="sidebar-header text-center p-3">
      <img src="admin.webp" class="logo-sm mb-2">
      <h6 class="m-0">Admin</h6>
    </div>
    <nav class="nav flex-column mt-3">
      <a class="nav-link active" href="#">Overview</a>
      <a class="nav-link" href="#">Students</a>
      <a class="nav-link" href="#">Certificates</a>
      <a class="nav-link" href="#">Run Scoring</a>
      <a class="nav-link" href="#">Settings</a>
      <a class="nav-link text-danger" href="#">Logout</a>
    </nav>
    <div class="sidebar-footer mt-auto p-3 text-center small text-muted">Admin Panel</div>
  </aside>

  <!-- Main content -->
  <main class="content p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="m-0">Admin Overview</h3>
    </div>

    <!-- Stats cards -->
    <div class="row g-3">
      <div class="col-md-3">
        <div class="stat-card card p-3">
          <h6>Students</h6>
          <div class="h3">120</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card card p-3">
          <h6>Certificates</h6>
          <div class="h3">85</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card card p-3">
          <h6>Pending Verifications</h6>
          <div class="h3 text-warning">10</div>
        </div>
      </div>
    </div>

    <!-- Top ranked students -->
    <div class="mt-3">
      <div class="card p-3">
        <h6>Top Ranked Students</h6>
        <table class="table table-borderless">
          <thead>
            <tr><th>#</th><th>Name</th><th>Score</th><th>Action</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>Alice Johnson</td>
              <td>98.5</td>
              <td><button class="btn btn-sm btn-outline-primary">View</button></td>
            </tr>
            <tr>
              <td>2</td>
              <td>Bob Smith</td>
              <td>95.0</td>
              <td><button class="btn btn-sm btn-outline-primary">View</button></td>
            </tr>
            <tr>
              <td>3</td>
              <td>Charlie Davis</td>
              <td>93.7</td>
              <td><button class="btn btn-sm btn-outline-primary">View</button></td>
            </tr>

    <!-- Student detail panel -->
    <div class="mt-3" id="studentDetailContainer" style="display:none;">
      <div class="card p-3" id="studentDetailCard">Student details will appear here.</div>
    </div>
  </main>
</div>
</body>
</html>
