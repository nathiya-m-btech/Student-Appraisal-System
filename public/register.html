<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Student Appraisal System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #004aad, #00b7ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 15px;
            width: 380px;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
        input {
            background: rgba(255,255,255,0.3) !important;
            color: #fff !important;
            border: none !important;
        }
        input::placeholder { color: #eee !important; }
        a { color: yellow; }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center mb-3">Create Account</h3>

    <form action="/student_appraisal/public/register.php" method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="name" placeholder="Enter Name" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" placeholder="Choose Username" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" name="email" placeholder="Enter Email" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Create Password" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" name="confirm_password" placeholder="Re-enter Password" required>
        </div>

        <button class="btn btn-warning w-100 mt-2">Register</button>

        <p class="text-center mt-3">
            Already have an account?  
            <a href="/student_appraisal/public/enhanced_login.html">Login</a>
        </p>

    </form>
</div>

</body>
</html>
